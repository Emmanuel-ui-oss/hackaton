services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/app/media:ro
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      DOMAIN: ${DOMAIN}
      CORE_HOST: core
      CORE_PORT: "9100"
    depends_on:
      db:
        condition: service_healthy
      core:
        condition: service_started
    volumes:
      - media_data:/app/media
    restart: unless-stopped

  core:
    build:
      context: .
      dockerfile: Dockerfile.core
    env_file: .env
    command: python core/server.py --host 0.0.0.0 --port 9100
    restart: unless-stopped

  db:
    image: mysql:8.0
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-visionvial_prod}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data:
  media_data:
