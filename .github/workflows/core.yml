name: visionvial-core build

on:
  push:
    branches: [main]
    paths: ["core/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd core
          pip install -r requirements.txt

      - name: Build binary with Nuitka
        run: |
          cd core
          py build.py --encrypt-key "${{ secrets.CORE_ENCRYPT_KEY }}"

      - name: Upload encrypted artifact
        uses: actions/upload-artifact@v4
        with:
          name: visionvial-core-encrypted
          path: core/dist/visionvial-core.enc

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: core-${{ github.sha }}
          files: |
            core/dist/visionvial-core.enc
            core/dist/visionvial-core.enc.sha256
